{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="d-flex justify-content-between mb-3">

        <h3>Administrator Management</h3>

        <a href="{{ url_for('add_admin') }}"
           class="btn btn-success">
            Add Administrator
        </a>

    </div>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">

            <tr>

                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Role</th>
                <th>Action</th>

            </tr>

        </thead>

        <tbody>

{% for admin in admins %}

<tr>

    <td>{{ admin[0] }}</td>
    <td>{{ admin[1] }}</td>
    <td>{{ admin[2] }}</td>
    <td>{{ admin[3] }}</td>

    <td>

    <a href="{{ url_for('edit_admin', id=admin[0]) }}"
       class="btn btn-warning btn-sm">
        Edit
    </a>

    <a href="{{ url_for('delete_admin', id=admin[0]) }}"
       class="btn btn-danger btn-sm"
       onclick="return confirm('Are you sure you want to delete this administrator?')">
        Delete
    </a>

</td>

</tr>

{% endfor %}

</tbody>

    </table>

</div>

{% endblock %}
