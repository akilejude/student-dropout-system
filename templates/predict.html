{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <h2 class="mb-4 text-primary">
        <i class="fas fa-user-graduate"></i>
        Student Dropout Prediction
    </h2>

    <div class="card shadow">

        <div class="card-header bg-success text-white">

            <h4 class="mb-0">
                Student Prediction Form
            </h4>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Student ID / Matric Number</label>
                        <input
                            type="text"
                            class="form-control"
                            name="student_id"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Student Name</label>
                        <input
                            type="text"
                            class="form-control"
                            name="student_name"
                            required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Age</label>
                        <input
                            type="number"
                            class="form-control"
                            name="age"
                            min="10"
                            max="100"
                            required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Gender</label>

                        <select class="form-select" name="gender" required>
    <option value="">Select Gender</option>
    <option value="0">Male</option>
    <option value="1">Female</option>
</select>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Level</label>

                        <select class="form-select" name="level" required>
                            <option>100</option>
                            <option>200</option>
                            <option>300</option>
                            <option>400</option>
                            <option>500</option>
                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Department</label>

                        <select class="form-select" name="department" required>

                            <option value="">-- Select Department --</option>

                            <option>Computer Science</option>
                            <option>Information Technology</option>
                            <option>Software Engineering</option>
                            <option>Cyber Security</option>
                            <option>Data Science</option>

                            <option>Accounting</option>
                            <option>Economics</option>
                            <option>Business Administration</option>
                            <option>Banking and Finance</option>

                            <option>Mass Communication</option>
                            <option>Political Science</option>
                            <option>Sociology</option>

                            <option>Nursing</option>
                            <option>Public Health</option>
                            <option>Education</option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Attendance (%)</label>

                        <input
                            type="number"
                            class="form-control"
                            name="attendance"
                            min="0"
                            max="100"
                            required>

                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">CGPA</label>

                        <input
                            type="number"
                            step="0.01"
                            min="0"
                            max="5"
                            class="form-control"
                            name="cgpa"
                            required>

                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Failed Courses</label>

                        <input
                            type="number"
                            class="form-control"
                            name="failed_courses"
                            min="0"
                            required>

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">LMS Engagement</label>

                        <select class="form-select" name="lms" required>
                            <option>Low</option>
                            <option>Medium</option>
                            <option>High</option>
                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Financial Stress</label>

                        <select class="form-select" name="financial" required>
                            <option>Yes</option>
                            <option>No</option>
                        </select>

                    </div>

                </div>

                <hr>

                <div class="text-center">

                    <button type="submit" class="btn btn-success btn-lg">
                        <i class="fas fa-play"></i>
                        Predict Student
                    </button>

                    <a href="/dashboard" class="btn btn-dark btn-lg">
                        <i class="fas fa-home"></i>
                        Dashboard
                    </a>

                    <a href="/students" class="btn btn-secondary btn-lg">
                        <i class="fas fa-users"></i>
                        Student Records
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
