{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-success text-white">

            <h3>
                <i class="fas fa-building"></i>
                Department Report
            </h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <!-- Department Selection -->

                <div class="mb-3">

                    <label class="form-label">
                        Select Department
                    </label>

                    <select
                        class="form-select"
                        name="department"
                        required>

                        <option value="" selected disabled>
                            -- Select Department --
                        </option>

                        {% for dept in departments %}

                        <option value="{{ dept[0] }}">
                            {{ dept[0] }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- Report Buttons -->

                <div class="d-flex flex-wrap gap-2">

                    <button
                        type="submit"
                        formaction="{{ url_for('print_department') }}"
                        class="btn btn-success">

                        <i class="fas fa-file-pdf"></i>
                        Department PDF

                    </button>


                    <button
                        type="submit"
                        formaction="{{ url_for('export_department') }}"
                        class="btn btn-outline-success">

                        <i class="fas fa-file-excel"></i>
                        Department Excel

                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- Back to Reports -->

    <div class="mt-4 mb-4">

        <a
            href="{{ url_for('reports') }}"
            class="btn btn-secondary">

            <i class="fas fa-arrow-left"></i>
            <i class="fas fa-arrow-left"></i>
            Back to Reports

        </a>

    </div>

</div>

{% endblock %}
