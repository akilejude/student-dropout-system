{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-success text-white">
            <h3>Reset Password</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label>Username</label>
                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        required>
                </div>

                <div class="mb-3">
                    <label>Verification Code</label>
                    <input
                        type="text"
                        name="code"
                        class="form-control"
                        required>
                </div>

                <div class="mb-3">
                    <label>New Password</label>
                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        required>
                </div>

                <button class="btn btn-success">
                    Reset Password
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
