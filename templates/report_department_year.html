{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-info text-white">

            <h3>
                <i class="fas fa-filter"></i>
                Department + Year Report
            </h3>

        </div>

        <div class="card-body">

            <form
                action="{{ url_for('print_department_year') }}"
                method="POST">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Department
                        </label>

                        <select
                            class="form-select"
                            name="department"
                            required>

                            <option value="" selected disabled>
                                -- Select Department --
                            </option>

                            {% for dept in departments %}

                            <option value="{{ dept[0] }}">
                                {{ dept[0] }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Year
                        </label>

                        <select
                            class="form-select"
                            name="level"
                            required>

                            <option value="" selected disabled>
                                -- Select Year --
                            </option>

                            <option value="100">Year 1</option>
                            <option value="200">Year 2</option>
                            <option value="300">Year 3</option>
                            <option value="400">Year 4</option>
                            <option value="500">Year 5</option>
                        </select>

                    </div>

                    <div class="col-md-2 mb-3 d-flex align-items-end gap-2">

                        <button
                            type="submit"
                            formaction="{{ url_for('print_department_year') }}"
                            class="btn btn-info text-white">

                            <i class="fas fa-file-pdf"></i>
                            PDF

                        </button>

                        <button
                            type="submit"
                            formaction="{{ url_for('export_department_year') }}"
                            class="btn btn-success">

                            <i class="fas fa-file-excel"></i>
                            Excel

                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
