{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">
{% if error %}

<div class="alert alert-danger alert-dismissible fade show" role="alert">

    <strong>Error!</strong> {{ error }}

    <button type="button"
            class="btn-close"
            data-bs-dismiss="alert">
    </button>

</div>

{% endif %}
        <div class="card-header bg-success text-white">
<h2 class="text-center text-danger">
***  ADD NEW STUDENT PAGE ***
</h2>
                <i class="fas fa-user-plus"></i>
                Add Student Record
            </h2>
        </div>

        <div class="card-body">

            <form action="{{ url_for('add_student') }}" method="POST">

                <div class="row">

                    

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Student Name</label>
                        <input type="text"
                               name="student_name"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Age</label>
                        <input type="number"
                               name="age"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Gender</label>
                        <select name="gender" class="form-select" required>
                            <option value="">Select Gender</option>
                            <option>Male</option>
                            <option>Female</option>
                        </select>
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Department</label>
                        <select name="department" class="form-select" required>
                            <option value="">Select Department</option>
                            <option>Computer Science</option>
                            <option>Information Technology</option>
                            <option>Software Engineering</option>
                            <option>Cyber Security</option>
                            <option>Data Science</option>
                            <option>Accounting</option>
                            <option>Business Administration</option>
                            <option>Economics</option>
                            <option>Nursing</option>
                            <option>Public Health</option>
                            <option>Education</option>
                        </select>
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Level</label>
                        <select name="level" class="form-select" required>
                            <option>100</option>
                            <option>200</option>
                            <option>300</option>
                            <option>400</option>
                            <option>500</option>
                        </select>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Attendance (%)</label>
                        <input type="number"
                               step="0.01"
                               name="attendance"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">CGPA</label>
                        <input type="number"
                               step="0.01"
                               name="cgpa"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Failed Courses</label>
                        <input type="number"
                               name="failed_courses"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">LMS Engagement</label>
                        <select name="lms_engagement" class="form-select" required>
                            <option>Low</option>
                            <option>Medium</option>
                            <option>High</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Financial Stress</label>
                        <select name="financial_stress" class="form-select" required>
                            <option>Yes</option>
                            <option>No</option>
                        </select>
                    </div>

                </div>

                <div class="text-center">

                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save"></i> Save Student
                    </button>

                    <a href="{{ url_for('students') }}" class="btn btn-secondary">
                        Student Records
                    </a>

                    <a href="{{ url_for('dashboard') }}" class="btn btn-dark">
                        Dashboard
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
