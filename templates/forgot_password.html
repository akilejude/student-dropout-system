{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Forgot Password</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label>Username</label>
                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        required>
                </div>

                <button class="btn btn-primary">
                    Send Verification Code
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
